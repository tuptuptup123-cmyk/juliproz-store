name: WebKit storefront checks
on:
  pull_request:
    paths: ['tests/catalog-seo.browser.cjs', '.github/workflows/webkit-audit.yml', 'app.js', 'mobile-navigation.js', 'site-language.js', 'catalog-seo.js']
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/jp-webkit" --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - run: node "$RUNNER_TEMP/jp-webkit/node_modules/playwright/cli.js" install --with-deps webkit
      - run: node scripts/stage-photo-assets.cjs
      - run: node scripts/build-telegram.cjs
      - run: node tests/catalog-seo.browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/jp-webkit/node_modules
          QA_BROWSER: webkit
          QA_OUTPUT: ${{ runner.temp }}/jp-webkit-qa
      - run: node tests/product-deeplink.browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/jp-webkit/node_modules
          QA_BROWSER: webkit
      - run: node tests/manager-contact.browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/jp-webkit/node_modules
          QA_BROWSER: webkit
          QA_OUTPUT: ${{ runner.temp }}/jp-webkit-qa
      - run: node tests/telegram-origin.browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/jp-webkit/node_modules
          QA_BROWSER: webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: webkit-audit
          path: ${{ runner.temp }}/jp-webkit-qa
          retention-days: 7
