name: Responsive catalogue checks
on:
  pull_request:
    paths: ['apps/telegram/**', 'scripts/build-telegram.cjs', 'telegram-entry.js', 'app.js', 'site-language.js', '*translations.js', 'admin.js', 'admin-manager.js', 'admin-session.js', 'admin-workspace.js', 'admin-sales.js', 'admin-finance.js', 'admin-product-finance.js', 'admin-schedule.js', '*.css', '*.html', 'product-sizes.js', 'product-sharing.js', 'analytics.js', 'photo-studio.js', 'tests/*.browser.cjs', 'tests/admin-action-helper.cjs', '.github/workflows/responsive.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/jp-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - run: node "$RUNNER_TEMP/jp-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/build-telegram.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/team-picks.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-product-finance.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-finance.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-schedule.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/admin-performance.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-design.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-sales.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/separate-storefronts.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/site-language.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/catalog-notice.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/product-sharing.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/admin-invitation.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/admin-mfa.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/admin-session.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" node tests/admin-reload.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/admin-workspace.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/light-shadow.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/catalog-prices.browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-preview
          path: |
            ${{ runner.temp }}/jp-qa/live-sale-catalog-*.png
            ${{ runner.temp }}/jp-qa/services-*.png
            ${{ runner.temp }}/jp-qa/manager-contact-*.png
            ${{ runner.temp }}/jp-qa/light-shadow-comparison-*.png
          retention-days: 7
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/brioni-group.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/loro-colors.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/responsive.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/action-guards.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/photo-analytics.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/audit-fixes.browser.cjs
      - run: NODE_PATH="$RUNNER_TEMP/jp-browser/node_modules" QA_OUTPUT="$RUNNER_TEMP/jp-qa" node tests/design-review.browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: responsive-screenshots
          path: ${{ runner.temp }}/jp-qa
          retention-days: 7
