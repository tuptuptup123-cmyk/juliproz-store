<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULI.PROZ — управление наличием</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><main class="app"><header class="brand"><div class="logo">J.P</div><p>Управление наличием</p><a href="/">Открыть магазин</a></header><p id="status" role="status"></p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Войти</button><button id="recover" type="button">Забыли пароль?</button></form><form id="confirmEmail" class="hidden"><p>Скопируй ссылку восстановления из письма и вставь сюда.</p><label>Ссылка из письма<input name="confirmation" type="url" required autocomplete="off"></label><button class="primary">Подтвердить почту и войти</button></form><form id="newPassword" class="hidden"><label>Новый пароль<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary">Сохранить пароль</button></form><section id="workspace" class="hidden"><div class="toolbar"><button id="newProduct" type="button">Добавить товар</button><button id="logout" type="button">Выйти</button></div><input id="adminSearch" placeholder="Поиск по названию, бренду или артикулу"><div id="inventory"></div><form id="editor" class="hidden"><h2 id="editorTitle">Товар</h2><label>Бренд<input name="brand" required maxlength="150"></label><label>Название<input name="name" required maxlength="250"></label><label>Категория<input name="category" required maxlength="100" list="categories"></label><datalist id="categories"><option>Сумки</option><option>Обувь</option><option>Одежда</option><option>Украшения</option><option>Часы</option><option>Аксессуары</option></datalist><label>Размер<input name="size" maxlength="100"></label><label>Цена<input name="price" type="number" min="0" step="0.01"></label><label>Валюта<select name="currency"><option>EUR</option><option>USD</option><option>AED</option><option>RUB</option><option>GBP</option></select></label><label>Описание<textarea name="description" rows="4" maxlength="5000"></textarea></label><label><input name="available" type="checkbox" checked> В наличии</label><p>Первое фото — обложка. Нажми «Обложка», чтобы выбрать другое.</p><div id="photos"></div><label>Добавить фотографии<input id="uploads" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label>Или ссылка на фотографию<input id="photoUrl" type="url" placeholder="https://..."></label><button id="addUrl" type="button">Добавить фото по ссылке</button><div class="toolbar"><button class="primary" id="save">Сохранить</button><button id="cancel" type="button">Отмена</button></div></form></section></main><script src="config.js"></script><script src="image-policy.js"></script><script src="admin.js"></script></body></html>
