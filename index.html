<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef"><title>J.P Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<main class="app">
<header class="brand"><div class="logo">J.P</div><div class="brand-line"></div></header>
<div class="search"><span>⌕</span><input id="search" placeholder="Поиск по наличию..."></div>
<div class="filters"><button data-filter="category">Категория</button><button data-filter="brand">Бренд</button><button data-filter="size">Размер</button></div>
<div class="catalog-head"><span id="count"></span><button id="reset">↕</button></div>
<section id="grid" class="grid"></section>
</main>
<nav class="bottom"><button class="active" data-tab="catalog">⌂<small>В наличии</small></button><button data-tab="favorites">♡<small>Избранное</small></button><button id="chatBtn">◌<small>Чат</small></button></nav>
<div id="sheet" class="sheet hidden"><div class="panel"><div class="panel-head"><h2 id="sheetTitle"></h2><button id="closeSheet">×</button></div><div id="sheetOptions" class="options"></div><button id="applyFilter" class="primary">Применить</button></div></div>
<div id="productModal" class="product-modal hidden"><button id="backProduct" class="back">‹</button><div id="productContent"></div></div>
<script src="app.js"></script></body></html>
