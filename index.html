<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c90b9" />
  <title>J.P Store</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css?v=20261008-cart-v1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="logo">J.P</div>
      <div class="brand-line" aria-hidden="true"></div>
    </header>

    <div class="catalog-toolbar">
    <button id="openCatalogMenu" class="catalog-menu-button" type="button" aria-expanded="false" aria-controls="catalogMenu"><span class="menu-icon" aria-hidden="true">☰</span>Меню<span id="menuBadge" class="menu-badge hidden">0</span></button>
    <button id="toggleSearch" class="search-toggle" type="button" aria-label="Поиск по каталогу" aria-expanded="false" aria-controls="catalogSearch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    <section id="catalogSearch" class="search-wrap hidden">
      <span>⌕</span>
      <input id="search" aria-label="Поиск по каталогу" placeholder="Поиск по каталогу..." autocomplete="off" />
    </section>

    </div>
    <p id="filterSummary" class="filter-summary hidden" aria-live="polite"></p>
    <section class="filters hidden" aria-hidden="true">
      <button data-filter="category">Категория</button>
      <button data-filter="brand">Бренд</button>
      <button data-filter="size">Размер</button>
      <button data-filter="fulfillment_status">Наличие</button>
    </section>

    <section class="catalog-head">
      <span id="count">Загружаем наличие…</span>
      <button id="reset" class="reset" aria-label="Сбросить фильтры">Сбросить</button>
    </section>

    <section id="grid" class="grid"></section>
    <section id="cartPage" class="cart-page hidden" aria-labelledby="cartTitle"><h1 id="cartTitle">Корзина</h1><div id="cartContent"></div><p id="cartStatus" role="status" aria-live="polite"></p></section>
  </main>


  <div id="catalogMenu" class="catalog-menu hidden">
    <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Закрыть меню каталога" tabindex="-1"></button>
    <section class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="catalogMenuTitle">
      <header class="menu-header"><div><span class="menu-eyebrow">J.P STORE</span><h2 id="catalogMenuTitle">Ваш выбор</h2></div><button id="closeCatalogMenu" class="menu-close" type="button" aria-label="Закрыть меню каталога">×</button></header>
      <div class="menu-scroll">
        <h3 class="menu-section-label">Для кого</h3>
    <section class="audience-tabs" aria-label="Раздел каталога">
      <button type="button" data-gender="" aria-pressed="true">Все</button>
      <button type="button" data-gender="women" aria-pressed="false">Женское</button>
      <button type="button" data-gender="men" aria-pressed="false">Мужское</button>
    </section>
        <div id="menuGroups" class="menu-groups"></div>
      </div>
      <footer class="menu-footer"><button id="showMenuProducts" class="primary" type="button">Показать товары</button><button id="resetMenu" class="menu-reset" type="button">Сбросить выбор</button></footer>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-tab="catalog">⌂<small>Каталог</small></button>
    <button data-tab="favorites">♡<small>Виш-лист</small></button>
    <button data-tab="cart" aria-label="Корзина">♧<small>Корзина <span id="cartBadge" class="cart-badge hidden">0</span></small></button>
    <button id="chatBtn">◌<small>Чат</small></button>
  </nav>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-top"><h2 id="sheetTitle">Фильтр</h2><button id="closeSheet">×</button></div>
      <div id="sheetOptions" class="options"></div>
      <button id="applyFilter" class="primary">Применить</button>
    </div>
  </div>

  <div id="productModal" class="product-modal hidden">
    <button id="backProduct" class="back" aria-label="Вернуться в каталог">‹</button>
    <div id="productContent"></div>
  </div>

  <script src="config.js"></script>
  <script src="image-policy.js"></script>
  <script src="product-sizes.js"></script><script src="app.js?v=20261008-cart-v1"></script>
</body>
</html>
