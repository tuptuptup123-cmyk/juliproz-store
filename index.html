<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c90b9" />
  <title>J.P Store</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css?v=20261009-condition-sections" />
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header class="brand">
      <div class="masthead-inner">
        <div class="catalog-toolbar masthead-controls">
    <button id="openCatalogMenu" class="catalog-menu-button" type="button" aria-expanded="false" aria-controls="catalogMenu"><span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>Меню<span id="menuBadge" class="menu-badge hidden">0</span></button>
    <button id="toggleSearch" class="search-toggle" type="button" aria-label="Поиск по каталогу" aria-expanded="false" aria-controls="catalogSearch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        </div>
        <div class="brand-lockup"><div class="logo">J.P</div></div>
        <button id="brandPaw" class="brand-paw" type="button" aria-label="Оживить лапу J.P"><img src="images/brand-paw.webp" alt="" width="1536" height="1024" /></button>
    <section id="catalogSearch" class="search-wrap hidden">
      <span>⌕</span>
      <input id="search" aria-label="Поиск по каталогу" placeholder="Поиск по каталогу..." autocomplete="off" />
    </section>
      </div>
    </header>
  <main class="app">
    <p id="filterSummary" class="filter-summary hidden" aria-live="polite"></p>
    <section class="filters hidden" aria-hidden="true">
      <button data-filter="category">Категория</button>
      <button data-filter="brand">Бренд</button>
      <button data-filter="size">Размер</button>
      <button data-filter="fulfillment_status">Наличие</button>
    </section>

    <section class="catalog-head">
      <span id="count">Загружаем наличие…</span>
      <button id="reset" class="reset" aria-label="Сбросить фильтры">Сбросить</button>
    </section>

    <section id="grid" class="grid"></section>
    <section id="cartPage" class="cart-page hidden" aria-labelledby="cartTitle"><h1 id="cartTitle">Корзина</h1><div id="cartContent"></div><p id="cartStatus" role="status" aria-live="polite"></p></section>
  </main>


  <div id="catalogMenu" class="catalog-menu hidden">
    <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Закрыть меню каталога" tabindex="-1"></button>
    <section class="menu-panel" role="dialog" aria-modal="true" aria-label="Меню каталога">
      <header class="menu-header"><div class="menu-brand" aria-label="J.P"><span class="menu-logo">J.P</span><img class="menu-paw" src="images/brand-paw.webp" alt="" width="1536" height="1024" /></div><button id="closeCatalogMenu" class="menu-close" type="button" aria-label="Закрыть меню каталога">×</button></header>
      <div class="menu-scroll">
        <h3 class="menu-section-label">Для кого</h3>
    <section class="audience-tabs" aria-label="Раздел каталога">
      <button type="button" data-gender="" aria-pressed="true">Все</button>
      <button type="button" data-gender="women" aria-pressed="false">Женское</button>
      <button type="button" data-gender="men" aria-pressed="false">Мужское</button>
    </section>
        <div id="menuGroups" class="menu-groups"></div><div class="privacy-links"><a href="privacy.html" target="_blank" rel="noopener">Конфиденциальность ↗</a><button id="analyticsPreferences" type="button">Настройки статистики</button></div>
      </div>
      <footer class="menu-footer"><button id="showMenuProducts" class="primary" type="button">Показать товары</button><button id="resetMenu" class="menu-reset" type="button">Сбросить выбор</button></footer>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-tab="catalog">⌂<small>Каталог</small></button>
    <button data-tab="favorites">♡<small>Виш-лист</small></button>
    <button data-tab="cart" aria-label="Корзина"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l3 12h10l3-9H6"/><path d="M8 15l-1 3h12"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg><small>Корзина <span id="cartBadge" class="cart-badge hidden">0</span></small></button>
  </nav>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-top"><h2 id="sheetTitle">Фильтр</h2><button id="closeSheet">×</button></div>
      <div id="sheetOptions" class="options"></div>
      <button id="applyFilter" class="primary">Применить</button>
    </div>
  </div>

  <div id="productModal" class="product-modal hidden" role="dialog" aria-modal="true" aria-label="Карточка товара" tabindex="-1">
    <button id="backProduct" class="back" aria-label="Вернуться в каталог">‹</button>
    <div id="productContent"></div>
  </div>

  <section id="analyticsConsent" class="analytics-consent hidden" aria-label="Настройки статистики"><p>Разрешить статистику посещений? Это помогает улучшать магазин. Корзина и виш-лист работают при любом выборе. <a href="privacy.html" target="_blank" rel="noopener">Подробнее ↗</a></p><div><button id="analyticsAccept" type="button">Разрешить</button><button id="analyticsDecline" type="button">Без статистики</button></div></section>
  <div class="nav-paw-layer" aria-hidden="true"><img id="moneyPaw" class="money-paw" src="images/money-paw-v1.webp" alt="" width="1024" height="1536" /><img id="navPaw" class="nav-paw" src="images/brand-paw.webp" alt="" aria-hidden="true" width="1536" height="1024" /></div>
  <script defer src="config.js"></script>
  <script defer src="image-policy.js"></script>
  <script defer src="product-sizes.js?v=20261009-action-guards-v6"></script><script defer src="analytics.js"></script><script defer src="app.js?v=20261009-condition-sections"></script>
</body>
</html>
