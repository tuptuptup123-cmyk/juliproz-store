<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>J.P Store</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="logo">JP</div>
      <div class="brand-line" aria-hidden="true"></div>
    </header>

    <section class="search-wrap">
      <span>⌕</span>
      <input id="search" placeholder="Поиск по наличию..." autocomplete="off" />
    </section>

    <section class="filters">
      <button data-filter="category">Категория</button>
      <button data-filter="brand">Бренд</button>
      <button data-filter="size">Размер</button>
    </section>

    <section class="catalog-head">
      <span id="count">Загружаем наличие…</span>
      <button id="reset" class="reset" aria-label="Сбросить фильтры">Сбросить</button>
    </section>

    <section id="grid" class="grid"></section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-tab="catalog">⌂<small>В наличии</small></button>
    <button data-tab="favorites">♡<small>Избранное</small></button>
    <button id="chatBtn">◌<small>Чат</small></button>
  </nav>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <div class="sheet-top"><h2 id="sheetTitle">Фильтр</h2><button id="closeSheet">×</button></div>
      <div id="sheetOptions" class="options"></div>
      <button id="applyFilter" class="primary">Применить</button>
    </div>
  </div>

  <div id="productModal" class="product-modal hidden">
    <button id="backProduct" class="back">‹</button>
    <div id="productContent"></div>
  </div>

  <script src="config.js"></script>
  <script src="image-policy.js"></script>
  <script src="app.js"></script>
</body>
</html>
